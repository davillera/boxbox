[project]
name = "boxbox-backend"
version = "0.1.0"
description = "BoxBox: FastAPI + SQLModel service for F1 race outcome predictions"
requires-python = ">=3.13"
dependencies = [
    "boxbox-ml",
    "fastapi==0.162.0",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.16.1",
    "sqlmodel==0.0.48",
    "uvicorn[standard]==0.54.0",
]

[tool.uv]
package = false

[tool.uv.sources]
boxbox-ml = { path = "../boxbox-ml", editable = true }

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
